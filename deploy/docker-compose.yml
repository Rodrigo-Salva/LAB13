name: veterinaria

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - datos-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b"]
      interval: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # Ejecuta el script SOLO si la base todavia no existe (el script borra las tablas)
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ../Veterinaria/BaseDatos/Veterinaria.sql:/script.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        SQL="/opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P $$SA_PASSWORD -b"
        existe=$$($$SQL -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name='VeterinariaDB'") || exit 1
        if [ "$$existe" = "0" ]; then $$SQL -f 65001 -i /script.sql; else echo "La base ya existe: no se toca"; fi

  veterinaria-api:
    build:
      context: ..
      dockerfile: deploy/docker/veterinaria.Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__VeterinariaDb: Server=sqlserver;Database=VeterinariaDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY}
    ports:
      - "127.0.0.1:${API_PORT:-5055}:8080"
    restart: unless-stopped

  servicio-vacunas:
    build:
      context: ..
      dockerfile: deploy/docker/vacunas.Dockerfile
    environment:
      Jwt__Key: ${JWT_KEY}
    ports:
      - "127.0.0.1:${VACUNAS_PORT:-5056}:8080"
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deploy/docker/gateway.Dockerfile
    environment:
      Jwt__Key: ${JWT_KEY}
    volumes:
      - ./generado/ocelot.json:/app/ocelot.json:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-5000}:8080"
    restart: unless-stopped

volumes:
  datos-sql:
